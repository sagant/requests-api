name: secured-api
version: 5
description: Flujo de especificación con revisión de seguridad y validación verificable

artifacts:
  - id: proposal
    generates: proposal.md
    description: Justificación, alcance e impacto del cambio
    template: proposal.md
    instruction: |
      Describir el problema, el comportamiento existente afectado, el alcance,
      las exclusiones, los contratos externos, los riesgos y las decisiones pendientes.
      Establecer criterios de aceptación de alto nivel.
    requires: []

  - id: specs
    generates: specs/**/*.md
    description: Requisitos y escenarios delta
    template: spec.md
    instruction: |
      Contrastar con las especificaciones vigentes y usar los deltas ADDED, MODIFIED,
      REMOVED o RENAMED según corresponda. En MODIFIED incluir el requisito completo
      actualizado, con sus Scenarios, no únicamente los fragmentos modificados.
      Incluir Scenarios verificables positivos, negativos y de borde pertinentes.
    requires: [proposal]

  - id: design
    generates: design.md
    description: Diseño y decisiones técnicas
    template: design.md
    instruction: |
      Explicar decisiones técnicas, alternativas y efectos sobre componentes existentes,
      datos, contratos externos, errores, configuración, permisos y compatibilidad.
      Documentar la estrategia de pruebas y regresión.
    requires: [proposal]

  - id: security-review
    generates: security-review.md
    description: Revisión de autenticación, autorización y exposición de datos
    template: security-review.md
    instruction: |
      Delimitar la superficie de seguridad afectada y las políticas aplicables.
      Construir una matriz de autorización vinculada a Scenarios. Identificar riesgos,
      mitigaciones y pruebas, y señalar las decisiones pendientes de revisión.
    requires: [specs, design]

  - id: tasks
    generates: tasks.md
    description: Tareas de implementación, trazabilidad y validación
    template: tasks.md
    instruction: |
      Generar tareas concretas a partir de los requisitos, diseño y revisión de seguridad.
      Registrar la relación entre cada Scenario y al menos una prueba automatizada
      identificable, incluyendo los casos negativos y de borde pertinentes.
      Incluir pruebas de regresión, ejecución de tests y revisión final del diff.
      Si cambia el contrato HTTP, incluir actualización y ejecución de Postman.
    requires: [specs, design, security-review]

apply:
  requires: [tasks, security-review]
  tracks: tasks.md
  instruction: |
    Implementar únicamente después de la revisión humana explícita del change.
    Seguir las tareas, comprobar la cobertura de los Scenarios con pruebas ejecutables,
    ejecutar las validaciones previstas y contrastar el diff con la propuesta aprobada.
    Mantener los contratos HTTP versionados sincronizados con los cambios acordados.
